# Diagnostic configuration: retain the normal locator batch while isolating
# each high-resolution statement page for extraction.
provider: openrouter
locator_model: qwen/qwen3.5-9b
vision_model: qwen/qwen3.5-9b
rationalisation_model: qwen/qwen3.5-9b
max_pages: 60
timeout_seconds: 180
concurrency: 1
locator_batch_size: 4
extraction_batch_size: 1
json_max_attempts: 2
openrouter_request_options:
  response_format:
    type: json_object
  reasoning:
    enabled: false
mlflow:
  enabled: true
  tracking_uri: http://127.0.0.1:5000
  experiment: companies-house-vlm-financial-eval
  run_name: openrouter-open-weight-locator4-extractor1
