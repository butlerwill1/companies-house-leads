# Set these IDs to an open-weight VLM available through OpenRouter.
provider: openrouter
locator_model: qwen/qwen3.5-9b
vision_model: qwen/qwen3.5-9b
rationalisation_model: qwen/qwen3.5-9b
max_pages: 60
timeout_seconds: 180
concurrency: 4
# Bound the number of images in each multimodal request. The locator still
# covers every page, and extraction still covers every selected statement page.
locator_batch_size: 4
extraction_batch_size: 2
# One original request plus one retry for invalid JSON or an invalid response shape.
json_max_attempts: 2
# Structured financial extraction does not need Qwen's reasoning trace; turning
# it off avoids spending output time/tokens on hidden analysis before JSON.
openrouter_request_options:
  response_format:
    type: json_object
  reasoning:
    enabled: false
mlflow:
  enabled: true
  tracking_uri: http://127.0.0.1:5000
  experiment: companies-house-vlm-financial-eval
  run_name: openrouter-open-weight
