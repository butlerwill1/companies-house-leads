# Capacity comparison against the existing Qwen 3.5 9B evaluation.  Keep the
# pipeline and prompts identical; only substitute the vision-language model.
provider: openrouter
locator_model: qwen/qwen3.5-122b-a10b
vision_model: qwen/qwen3.5-122b-a10b
rationalisation_model: qwen/qwen3.5-122b-a10b
max_pages: 60
timeout_seconds: 180
concurrency: 4
locator_batch_size: 8
extraction_batch_size: 4
json_max_attempts: 2
openrouter_request_options:
  response_format:
    type: json_object
  reasoning:
    enabled: false
mlflow:
  enabled: true
  tracking_uri: http://127.0.0.1:5000
  experiment: companies-house-vlm-financial-eval
  run_name: openrouter-qwen35-122b-a10b-gold-label-check-14-concurrency-4
