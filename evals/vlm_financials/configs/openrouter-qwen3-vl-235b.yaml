# Stronger open-weight vision-model benchmark. Keep rendering and batch sizes
# aligned with the established 9B baseline so results isolate model quality.
provider: openrouter
locator_model: qwen/qwen3-vl-235b-a22b-instruct
vision_model: qwen/qwen3-vl-235b-a22b-instruct
# Only failed primary-statement pages are re-rendered at this resolution and
# sent to a different vision model. Normal pages remain on Qwen 235B.
recovery_vision_model: google/gemini-2.5-flash
rationalisation_model: qwen/qwen3-vl-235b-a22b-instruct
max_pages: 60
timeout_seconds: 300
concurrency: 4
locator_batch_size: 4
extraction_batch_size: 2
# Locator classifies statement_type, statement_scope and contains_employee_count
# from these images; 384 px left headings a few pixels tall.
locator_render_long_edge: 768
recovery_render_long_edge: 2048
json_max_attempts: 2
openrouter_request_options:
  response_format:
    type: json_object
  reasoning:
    enabled: false
mlflow:
  enabled: true
  tracking_uri: http://127.0.0.1:5000
  experiment: companies-house-vlm-financial-eval
  run_name: openrouter-qwen3-vl-235b
