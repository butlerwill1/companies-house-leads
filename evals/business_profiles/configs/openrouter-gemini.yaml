# API keys stay in .env or the environment, never in this file.
provider: openrouter
model: google/gemini-2.5-flash
timeout_seconds: 120
langfuse:
  enabled: true
  key_env: BUSINESS_PROFILE      # -> LANGFUSE_{PUBLIC,SECRET}_KEY_BUSINESS_PROFILE in .env
  dataset: business-profile-gold
  run_name: openrouter-gemini
  deepeval:
    # LLM-as-judge faithfulness on business_description (advisory, never gates a
    # case). Off by default: with google/gemini-2.5-flash as the judge it is
    # slow and its JSON is flaky (failures are caught and skipped). Turn on
    # once a sturdier judge_model is chosen.
    enabled: false
    judge_model: google/gemini-2.5-flash
