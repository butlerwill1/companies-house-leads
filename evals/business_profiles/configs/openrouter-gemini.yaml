# API keys stay in .env or the environment, never in this file.
provider: openrouter
model: google/gemini-2.5-flash
timeout_seconds: 120
langfuse:
  enabled: true
  key_env: BUSINESS_PROFILE      # -> LANGFUSE_{PUBLIC,SECRET}_KEY_BUSINESS_PROFILE in .env
  dataset: business-profile-gold
  run_name: openrouter-gemini
  deepeval:
    enabled: true
    judge_model: google/gemini-2.5-flash
