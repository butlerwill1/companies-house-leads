# Fixed-endpoint Qwen 3.5 9B benchmark: SiliconFlow FP8, with no fallback.
provider: openrouter
locator_model: qwen/qwen3.5-9b
vision_model: qwen/qwen3.5-9b
rationalisation_model: qwen/qwen3.5-9b
max_pages: 60
